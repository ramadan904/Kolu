name: Verify live board

# Builds the actual board against live sources. Fails if it falls back to demo
# data, because that is the difference between a product and a mockup.

on:
  workflow_dispatch:
  schedule:
    - cron: "20 14 * * 1-5"
  push:
    paths:
      - "src/lib/**"
      - "scripts/verify-board.ts"
      - ".github/workflows/verify-board.yml"

jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run verify-board
        env:
          JUPITER_ENDPOINT: ${{ vars.JUPITER_ENDPOINT || 'https://lite-api.jup.ag' }}
